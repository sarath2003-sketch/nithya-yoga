<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NITHYA Yoga &amp; Wellness | Mindful Practice</title>
  <meta name="description" content="Professional Live Yoga Classes, Chakra Meditation, Mindful Reminders &amp; Wellness Practice">
  <meta name="application-name" content="NITHYA Yoga">
  
  <!-- Web App Manifest (PWABuilder & W3C Standard) -->
  <link rel="manifest" href="./manifest.json">

  <!-- Mobile & Theme Styling -->
  <meta name="theme-color" content="#7c3aed">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#7c3aed">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nithya Yoga">
  
  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="96x96" href="./assets/icons/icon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./assets/icons/icon-512.png">

  <!-- Open Graph & Social Cards -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NITHYA Yoga &amp; Wellness">
  <meta property="og:description" content="Professional Live Yoga Classes, Chakra Meditation, Mindful Reminders &amp; Wellness Practice">
  <meta property="og:image" content="./assets/screenshots/screenshot-desktop.png">

  <!-- Typography: Inter & Noto Sans Tamil -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="./src/styles.css?v=3.3.0">
  <link rel="stylesheet" href="./assets/yoga-ui.css?v=3.3.0">
</head>
<body>
  <div id="root"></div>

  <!-- React 18 Application Bundle -->
  <script src="./dist/bundle.js?v=3.3.0"></script>
  <script src="./assets/yoga-ui.js?v=3.3.0" defer></script>

  <!-- Production Service Worker Registration with Lifecycle & Update Listeners -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((registration) => {
            console.log('[PWA] ServiceWorker active on scope:', registration.scope);

            // Listen for waiting updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version ready for activation.');
                    // Notify worker to skip waiting if desirable
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });

            // Check for updates periodically every hour
            setInterval(() => {
              registration.update().catch(() => {});
            }, 60 * 60 * 1000);
          })
          .catch((err) => {
            console.warn('[PWA] ServiceWorker registration notice:', err);
          });

        // Reload smoothly when new controller takes over
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA] Controller changed; fresh assets active.');
          }
        });
      });
    }
  </script>
</body>
</html>
