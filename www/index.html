<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NITHYA Yoga &amp; Wellness | Mindful Practice</title>
  
  <!-- PWA & Android Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nithya Yoga">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  
  <!-- Plus Jakarta Sans with a Tamil-capable fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./assets/yoga-ui.css">
</head>
<body>
  <div id="root"></div>

  <!-- React 18 Application Bundle -->
  <script src="./dist/bundle.js"></script>
  <script src="./assets/yoga-ui.js" defer></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('NITHYA Yoga PWA ServiceWorker active:', reg.scope))
          .catch(err => console.warn('ServiceWorker registration note:', err));
      });
    }
  </script>
</body>
</html>
